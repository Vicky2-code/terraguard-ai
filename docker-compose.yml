version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: terraguard-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: terraguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: terraguard-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/terraguard
      - SECRET_KEY=terraguard_super_secret_key_2026
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: terraguard-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
